<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Oficina{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="of-grain" aria-hidden="true"></div>
    <header class="of-header">
        <a href="{{ url_for('index') }}" class="of-header__brand">
            <span class="of-header__mark">⚒</span>
            <span class="of-header__name">OFICINA</span>
        </a>
        {% block header_extra %}{% endblock %}
    </header>
    <main class="of-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="of-footer">
        <span>Oficina · bancada de testes dos projetos em desenvolvimento</span>
    </footer>
</body>
</html>
